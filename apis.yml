aid: fullcontact
name: FullContact
description: >-
  FullContact is a privacy-safe identity resolution platform that helps
  businesses recognize and understand customers across digital channels by
  unifying fragmented identifiers (email, phone, name, address, device IDs)
  into a single person-centric graph. The FullContact V3 REST API exposes
  Enrich, Resolve, Acumen, and Identity Streme products for enriching person
  and company records, recognizing identities, and managing customer data.
  Authentication is via Bearer API key sent in the Authorization header.
