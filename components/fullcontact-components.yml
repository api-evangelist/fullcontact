description: >-
  FullContact's client-side surface is the FullContact webtag — a JavaScript tag
  generated in the FullContact Platform and embedded on a customer's own
  websites. It is not an SDK and not a UI widget library: it is a first-party
  identity/recognition tag that runs in the visitor's browser and feeds the
  Customer Recognition and Acumen products. Installation is documented for
  seven host platforms, which is the closest thing FullContact ships to an
  embeddable component family.

components:
  - family: FullContact webtag
    kind: javascript tag
    products: [Customer Recognition, Acumen]
    distribution: >-
      Generated per account in the FullContact Platform configuration wizard
      and copied into the site. No public npm/CDN package — the tag embeds an
      account-scoped key, so there is no version to pin or registry to query.
    configuration:
      - name: Domain whitelist
        detail: >-
          Every site the tag runs on must be whitelisted; a `.*` regular
          expression whitelists all domains for that webtag key.
      - name: Advanced settings
        detail: Configured in the same wizard alongside the domain whitelist.
    related_services:
      - name: FullContact Webtag ID Service
        url: https://docs.fullcontact.com/docs/fullcontact-webtag-id-service
      - name: Consent Management Feature
        url: https://docs.fullcontact.com/docs/fullcontact-consent-management-feature
      - name: Quality Filtering
        url: https://docs.fullcontact.com/docs/quality-filtering-toggle
    docs:
      configure: https://docs.fullcontact.com/docs/configure-fullcontact-webtag
      install: https://docs.fullcontact.com/docs/webtag-installation-instructions

