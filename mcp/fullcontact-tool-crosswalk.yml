description: >-
  Binds each FullContact MCP tool to the REST operation that backs it, so the
  tool's real input contract is the operation's request body rather than a
  guess. FullContact's MCP surface is deliberately a strict subset of REST: one
  tool, one operation. Everything else the V3 API exposes is REST-only today.

