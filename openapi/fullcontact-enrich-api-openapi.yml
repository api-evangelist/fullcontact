openapi: 3.2.0
info:
  title: FullContact V3 Enrich API
  version: v3
  description: 'Best-effort OpenAPI 3.1 description of the FullContact V3 REST API for

    person/company enrichment, identity resolution, permissions, tags, and

    audience download. Generated from public documentation; not an official spec.'
  contact:
    name: FullContact Developer Portal
    url: https://docs.fullcontact.com
servers:
- url: https://api.fullcontact.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Enrich
paths:
  /v3/person.enrich:
    post:
      tags:
      - Enrich
      operationId: enrichPerson
      summary: Enrich a person record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Object'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /v3/company.enrich:
    post:
      tags:
      - Enrich
      operationId: enrichCompany
      summary: Enrich a company record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Object'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /v3/company.search:
    post:
      tags:
      - Enrich
      operationId: searchCompany
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Object'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
      summary: Search company
      x-summary-source: derived
components:
  responses:
    Ok:
      description: Successful response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Object'
  schemas:
    Object:
      type: object
      additionalProperties: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: FullContact API key passed as a Bearer token in the Authorization header.
