description: >-
  Versioning, deprecation and operational posture for the FullContact V3 API.
  FullContact versions in the URI path, runs a public Statuspage, and announces
  retirements through its docs changelog. What it does NOT publish is a written
  deprecation policy with a notice window, or RFC 8594 Sunset/Deprecation
  headers — retirement is communicated in prose and enforced with 410 Gone.

