    bearerAuth:
      type: http
      scheme: bearer
      description: FullContact API key passed as a Bearer token in the Authorization header.
  schemas:
    Object:
      type: object
      additionalProperties: true
  responses:
    Ok:
      description: Successful response
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Object" }
