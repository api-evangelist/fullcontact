openapi: 3.1.0
info:
  title: FullContact V3 Address Audience API
  version: v3
  description: 'Best-effort OpenAPI 3.1 description of the FullContact V3 REST API for

    person/company enrichment, identity resolution, permissions, tags, and

    audience download. Generated from public documentation; not an official spec.

    '
  contact:
    name: FullContact Developer Portal
    url: https://docs.fullcontact.com
servers:
- url: https://api.fullcontact.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Audience
paths:
  /v3/audience.create:
    post:
      tags:
      - Audience
      operationId: createAudience
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Object'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /v3/audience.download:
    post:
      tags:
      - Audience
      operationId: downloadAudience
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Object'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
components:
  schemas:
    Object:
      type: object
      additionalProperties: true
  responses:
    Ok:
      description: Successful response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Object'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: FullContact API key passed as a Bearer token in the Authorization header.
