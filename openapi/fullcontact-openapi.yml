openapi: 3.1.0
info:
  title: FullContact V3 API
  version: "v3"
  description: |
    Best-effort OpenAPI 3.1 description of the FullContact V3 REST API for
    person/company enrichment, identity resolution, permissions, tags, and
    audience download. Generated from public documentation; not an official spec.
  contact:
    name: FullContact Developer Portal
    url: https://docs.fullcontact.com
servers:
  - url: https://api.fullcontact.com
    description: Production
security:
  - bearerAuth: []
tags:
  - name: Enrich
  - name: Identity
  - name: Permission
  - name: Tags
  - name: Audience
  - name: Address
paths:
  /v3/person.enrich:
    post:
      tags: [Enrich]
      operationId: enrichPerson
      summary: Enrich a person record
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Object" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /v3/company.enrich:
    post:
      tags: [Enrich]
